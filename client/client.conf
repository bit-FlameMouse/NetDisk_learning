# ============================================================================
# NetDisk 客户端配置文件
#
# 路径：client/client.conf
# 用法：
#   netdisk-cli                        → 从本文件加载配置
#   netdisk-cli -h 192.168.1.100       → 指定服务端 IP（覆盖配置文件）
#   netdisk-cli -p 9999                → 指定端口
#   netdisk-cli -c /path/to/client.conf → 指定配置文件路径
# ============================================================================

# ============================================================================
# [server] — 连接的服务端信息
# ============================================================================
[server]

# 服务端 IP 地址或域名
host = 127.0.0.1

# 服务端监听端口
port = 8443

# ============================================================================
# [client] — 客户端本地行为
# ============================================================================
[client]

# 默认文件下载目录（相对路径基于执行目录）
# 使用 get 命令下载单个文件时默认存放位置
download_dir = ./downloads

# 与服务端建立 TCP 连接的超时时间（秒）
connect_timeout = 10

# 接收服务端响应的单帧超时时间（秒）
# 大文件下载不受此限制（流式传输）
recv_timeout = 30
