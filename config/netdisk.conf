# ============================================================================
# NetDisk 服务端配置文件
#
# 路径：config/netdisk.conf
# 启动方式：./netdisk-server -c config/netdisk.conf -d
#           -c 指定配置文件路径
#           -d 守护进程模式
#
# 安全提示：部署前请生成新的 jwt_secret 和数据库密码！
# ============================================================================

# ============================================================================
# [server] — 服务端监听参数
# ============================================================================
[server]

# 监听地址（0.0.0.0 = 监听所有网卡）
host = 0.0.0.0

# 监听端口
port = 8443

# 最大并发连接数
max_connections = 10240

# 连接空闲超时（秒）；超过此时间无任何数据交互则踢掉
idle_timeout = 60

# ============================================================================
# [database] — MySQL 连接参数
# ============================================================================
[database]

# MySQL 服务器地址（本机）
host = 127.0.0.1

# MySQL 端口
port = 3306

# 数据库名
name = netdisk

# 用户名
user = netdisk

# 密码（部署前必须更换！）
password = CHANGE_ME_DB_PASSWORD

# 连接池大小（启动时预创建，避免运行时频繁建连）
pool_size = 16

# 获取连接最大等待时间（秒）；超时则返回错误
pool_timeout = 5

# ============================================================================
# [security] — 安全相关
# ============================================================================
[security]

# JWT 签名密钥（部署前必须更换！）
# 生成命令：openssl rand -base64 32
jwt_secret = CHANGE_ME_JWT_SECRET_USE_openssl_rand_base64_32

# JWT 有效时长（秒）
jwt_expire_sec = 900

# 令牌桶限流：每分钟每个用户最大请求数
rate_limit_per_min = 30

# 密码 salt 长度（字节）
password_salt_len = 32

# ============================================================================
# [storage] — 文件存储参数
# ============================================================================
[storage]

# 文件存储根目录
data_dir = /data/netdisk/files

# 临时文件目录（上传中的分片存放于此）
tmp_dir = /data/netdisk/tmp

# 上传分片大小（字节）；大文件分帧传输的每帧最大载荷
chunk_size = 4194304

# 上传会话有效期（小时）；超时未完成的上传会话被清理
upload_session_ttl = 24

# 单用户存储配额（字节）；0 = 不限制
# 10737418240 = 10 GB
quota_bytes = 10737418240

# ============================================================================
# [cache] — 缓存参数
# ============================================================================
[cache]

# LRU 路径缓存最大条目数
path_cache_size = 10000

# 路径缓存过期时间（秒）
path_cache_ttl = 60

# ============================================================================
# [thread_pool] — 线程池参数
# ============================================================================
[thread_pool]

# 工作线程数（建议 = CPU 核数 × 2）
worker_count = 8

# 任务队列最大长度；超出后主线程阻塞等待
queue_size = 4096

# ============================================================================
# [log] — 日志参数
# ============================================================================
[log]

# 日志级别：0=DEBUG  1=INFO  2=WARN  3=ERROR  4=FATAL
level = 1

# 日志文件路径
file = /var/log/netdisk/server.log

# 单个日志文件最大大小（字节）；100 MB
max_file_size = 104857600

# 保留的历史日志文件数量
backup_count = 7

# ============================================================================
# [timer] — 时间轮参数
# ============================================================================
[timer]

# 时间轮槽位数
slot_count = 60

# 每个槽位的时间间隔（秒）
tick_interval = 1
